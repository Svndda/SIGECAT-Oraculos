      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from POST /auth/login
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource id (ULID).
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: Case-insensitive name search.
    Status:
      name: status
      in: query
      schema:
        type: string
        enum:
        - active
        - deleted
        - all
        default: active
      description: Soft-delete scope (admin only).
  schemas:
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_FIELD
        message:
          type: string
    Envelope:
      type: object
      properties:
        data:
          description: Response payload (object, array or null).
        meta:
          type: object
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    PaginatedEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    ErrorResponse:
      type: object
      properties:
        data:
          type: object
          nullable: true
        meta:
          type: object
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    PaginatedSuccess:
      description: Paginated list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedEnvelope'
    ValidationError:
      description: Invalid or missing fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
