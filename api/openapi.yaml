# Generated from api/config/routes.php. Regenerate when routes change.
openapi: 3.0.3
info:
  title: SIGECAT API
  version: 1.0.0
  description: 'REST API for SIGECAT, the workload/work-shift declaration system.


    All responses use a standard envelope `{ data, meta, errors }`. Authentication is a Bearer access
    token obtained from `POST /auth/login`. List endpoints accept `page`, `limit` and `filter`; soft-deletable
    resources also accept `status` (admin only).'
  license:
    name: Proprietary
servers:
- url: http://localhost:8000/api/public
  description: Local development
tags:
- name: Auth
  description: Login, token refresh, logout and password recovery.
- name: Users
  description: User accounts, roles and self-service profile.
- name: Job positions
  description: Job positions (plazas).
- name: Areas
  description: 'Organizational structure: areas.'
- name: Sections
  description: 'Organizational structure: sections.'
- name: Job classes
  description: Occupational classes catalogue.
- name: Declarations
  description: Work-shift declarations and their status workflow.
- name: Jobs
  description: Job types catalogue.
- name: Departments
  description: 'Organizational structure: departments.'
- name: Units
  description: 'Organizational structure: units.'
- name: Rest times
  description: Rest periods declared within a shift.
- name: Official functions
  description: Official function catalogue, per job.
- name: Custom functions
  description: Employee-defined ad-hoc functions.
- name: Job functions
  description: Functions reported on a declaration.
- name: License types
  description: Catalogue of permit/license types.
- name: Licenses
  description: Licenses declared within a shift.
- name: System logs
  description: Administrative audit trail.
